<body>
    <h1>A Quiz About Space Facts</h1>

    <div class="question">
        <h2>Question 1</h2>
        <p>What is the name of the planet we live on?</p>
        <input type="text" id="answer1" placeholder="Your answer">
    </div>

    <div class="question">
        <h2>Question 2</h2>
        <p>What do we see in the sky at night?</p>
        <input type="text" id="answer2" placeholder="Your answer">
    </div>

    <div class="question">
        <h2>Question 3</h2>
        <p>What is the name of the star at the center of our solar system?</p>
        <input type="text" id="answer3" placeholder="Your answer">
    </div>

    <button id="submitButton">Submit Quiz</button>

    <p id="result"></p>

    <script src="conditions.js"></script>
</body>
