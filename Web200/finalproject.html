<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pizza Order Page</title>
</head>
<body>
    <h1> Create your pizza </h1>

    <form id="pizzaform">

        <div class="section">
            <h2>1. Choose your pizza size</h2>
            <label><input type="radio" name="size" value="small" data-price="10" checked> small ($10.00) </label><br>
            <label><input type="radio" name="size" value="medium" data-price="15"> medium ($15.00) </label><br>
            <label><input type="radio" name="size" value="large" data-price="20"> large ($20.00) </label><br>
            <label><input type="radio" name="size" value="extra large" data-price="25"> extra large ($25.00)</label>
        </div>
        <div class="section">
            <h2>2. Choose your toppings (each topping $1.50)</h2>
            <label><input type="checkbox" name="toppings" value="pepperoni"> pepperoni</label><br>
            <label><input type="checkbox" name="toppings" value="sausage"> sausage</label><br>
            <label><input type="checkbox" name="toppings" value="mushrooms"> mushrooms </label><br>
            <label><input type="checkbox" name="toppings" value="bacon"> bacon</label><br>
            <label><input type="checkbox" name="toppings" value="five cheese"> five cheese </label><br>
            <label><input type="checkbox" name="toppings" value="onions"> onions</label><br>
        </div>
        <div class="section">
            <h2>3. customer contact information</h2>
            <label for="custname">Name:</label><br>
            <input type="text" id="custname" required><br><br>
            <label for="custemail">Email:</label><br>
            <input type="email" id="custemail" required><br><br>
            <label for="custphone">Phone:</label><br>
            <input type="tel" id="custphone" required><br><br>
            <label for="custaddress">Address:</label><br>
            <input type="text" id="custaddress" required><br><br>
            <label for="ordernotes">Order notes:</label><br>
            <textarea id="ordernotes" rows="3"></textarea> 
        </div>
        <div class="section">
            <h2>4. Order summary</h2>
            <label for="pizzaqty">Number of pizzas:</label>
            <input type="number" id="pizzaqty" value="1" min="1" max="20">

            <p><strong>size selected:</strong><span id="displaysize">small</span></p>

    </form>
</body>
</html>
